<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טל גורן · אדריכלית — 30 שניות</title>
<style>
@font-face{font-family:Heebo;font-weight:100 900;src:url(fonts/heebo-he.woff2) format("woff2");unicode-range:U+307-308,U+590-5FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:100 900;src:url(fonts/heebo-lat.woff2) format("woff2");unicode-range:U+??,U+131,U+152-153,U+2BB-2BC,U+2C6,U+2DA,U+2DC,U+304,U+308,U+329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Heebo;font-weight:100 900;src:url(fonts/heebo-lat2.woff2) format("woff2");unicode-range:U+100-2BA,U+2BD-2C5,U+2C7-2CC,U+2CE-2D7,U+2DD-2FF,U+304}
:root{--ink:#25323c;--slate:#2e4250;--clay:#a96f57;--paper:#fbfaf8;--sand:#ede8e1;--hair:#ddd6cb;--mute:#93a0a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0c1116;height:100%;overflow:hidden;font-family:Heebo,Assistant,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--paper);transform-origin:center;direction:rtl}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.dark{background:var(--slate);color:#fff}
.light{background:var(--paper);color:var(--slate)}
.grid{position:absolute;inset:-48px;background-image:linear-gradient(90deg,rgba(46,66,80,.06) 1px,transparent 1px),linear-gradient(rgba(46,66,80,.06) 1px,transparent 1px);background-size:48px 48px}
.dark .grid{background-image:linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px)}
.abs{position:absolute}
.h{white-space:nowrap;font-weight:900;letter-spacing:-.02em;line-height:1.02}
.label{font-weight:600;font-size:34px;letter-spacing:.14em;color:var(--clay);display:flex;align-items:center;gap:22px}
.label i{display:block;height:2px;width:70px;background:currentColor;opacity:.6;transform-origin:100% 50%}
.dark .label{color:#d4a08a}
.chip{position:absolute;background:var(--paper);color:var(--slate);border:2px solid var(--slate);padding:18px 30px;font-weight:800;font-size:48px;white-space:nowrap;box-shadow:12px 12px 0 var(--clay)}
.clay{color:var(--clay)}
.dark .clay{color:#d4a08a}
svg{overflow:visible}
.ln{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square}
.ph{position:absolute;overflow:hidden;background:var(--sand)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hud{position:absolute;inset:0;pointer-events:none;z-index:50}
.corner{position:absolute;width:70px;height:70px;border:0 solid rgba(255,255,255,.75)}
.bubble{position:absolute;padding:26px 34px;font-size:44px;font-weight:500;line-height:1.3;max-width:700px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#wipe{position:absolute;top:0;bottom:0;width:1180px;background:var(--clay);z-index:60;display:none}
#flash{position:absolute;inset:0;background:#fff;z-index:70;opacity:0;pointer-events:none}
#grain{position:absolute;inset:0;z-index:55;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#bar{position:absolute;top:0;right:0;height:8px;background:var(--clay);z-index:80}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99;background:rgba(12,17,22,.85);color:#fff;font-size:40px;font-weight:800;cursor:pointer;flex-direction:column;gap:14px;font-family:Heebo}
#start small{font-weight:400;font-size:20px;opacity:.6}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="start"><div>▶ לחצו להפעלה עם סאונד</div><small>30 שניות · 1080×1920</small></div>
<audio id="aud" src="audio.mp3" preload="auto"></audio>
<script>
const $=(s,p=document)=>p.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),back:x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const stage=$('#stage');
const el=(cls,html,style)=>{const d=document.createElement('div');d.className=cls||'';if(html!=null)d.innerHTML=html;if(style)d.style.cssText=style;return d};
// pop: animate element in from t0 (duration d) — opacity + translate/scale/rotate
function pop(e,t,t0,o={}){const d=o.d||.35,p=(o.ease||E.back)(seg(t,t0,t0+d)),q=E.out(seg(t,t0,t0+d*.6));
  e.style.opacity=t<t0?0:(o.fade===false?1:q);
  e.style.transform=`translate(${(o.x||0)*(1-p)}px,${(o.y||0)*(1-p)}px) scale(${(o.s==null?1:o.s+(1-o.s)*p)}) rotate(${(o.r||0)*(1-p)}deg)`+(o.post||'')}
function draw(p,e,t,a,b){e.style.strokeDasharray=1;e.style.strokeDashoffset=1-E.io(seg(t,a,b))}
const svg=(w,h,inner,style)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;${style||''}">${inner}</svg>`;
const words=(txt,cls,style)=>{const w=el('h '+(cls||''),txt.split(' ').map(x=>`<span class="w" style="display:inline-block;margin-inline-start:.22em">${x}</span>`).join(''),style);return w};
function wordAnim(root,t,t0,step=.12,o={}){[...root.querySelectorAll('.w')].forEach((w,i)=>pop(w,t,t0+i*step,Object.assign({y:60,d:.3},o)))}
const labelEl=(n,txt,style)=>el('label label',`<span>${n}</span><i></i><span>${txt}</span>`,style);

/* ================== scenes ================== */
const S={};
const sc=(id,cls,a,b)=>{const d=el('scene '+cls);d.id=id;d.dataset.a=a;d.dataset.b=b;stage.appendChild(d);return S[id]={d,a,b}};

/* ---- S0 hook 0-4 : POV, chaos ---- */
{const s=sc('s0','dark',0,4);s.d.appendChild(el('grid'));
 const cam=el('abs','',"inset:0");s.d.appendChild(cam);s.cam=cam;
 // the plot
 cam.insertAdjacentHTML('beforeend',svg(1080,1920,`
  <g style="color:#d4a08a"><path id="plot" class="ln" pathLength="1" d="M180 1230 L820 1180 L930 1480 L600 1640 L230 1560 Z" style="stroke-width:5"/></g>
  <g style="color:rgba(255,255,255,.4)" ><path id="plot2" class="ln" pathLength="1" d="M180 1230 L820 1180 L930 1480 L600 1640 L230 1560 Z" style="stroke-dasharray:14 14;transform:translate(0,0) scale(1);transform-origin:560px 1410px"/></g>
  <g style="color:#fff"><path id="dim1" class="ln" pathLength="1" d="M180 1140 L820 1090 M180 1120 v40 M820 1070 v40" style="stroke-width:2"/></g>`));
 cam.appendChild(el('abs',"<span>מגרש</span>","left:0;right:0;top:1360px;text-align:center;font-size:44px;font-weight:600;letter-spacing:.3em;color:rgba(255,255,255,.65)"));
 s.h1=words('יש לך מגרש.','',"position:absolute;right:70px;left:70px;top:190px;font-size:150px;color:#fff");
 s.h2=words('ומיליון שאלות.','',"position:absolute;right:70px;left:70px;top:380px;font-size:118px;color:#d4a08a");
 cam.append(s.h1,s.h2);
 const Q=[['כמה זה יעלה?',1.0,80,700,-5],['כמה זמן זה ייקח?',1.5,420,860,4],['איזה קבלן?',2.0,90,1000,3],['מי מטפל בוועדה?',2.5,330,1130,-4],['מאיפה מתחילים?',3.0,110,1290,5],['תקציב?',3.25,560,1420,-6],['היתר?',3.5,120,1470,3],['חריגות??',3.75,430,1560,-3]];
 s.q=Q.map(q=>{const c=el('chip',q[0],`right:${q[2]}px;top:${q[3]-120}px;font-size:${52+Math.round(q[1]*8)}px`);cam.appendChild(c);return {c,t0:q[1],r:q[4]}});
 s.cam=cam}
S.s0.update=t=>{const s=S.s0,sh=seg(t,1,4);
 const amp=sh*sh*22,tx=Math.sin(t*38)*amp,ty=Math.cos(t*31)*amp,z=1+sh*.16;
 s.cam.style.transform=`translate(${tx}px,${ty}px) scale(${z}) rotate(${Math.sin(t*7)*sh*1.2}deg)`;
 wordAnim(s.h1,t,.15,.14,{y:90});
 wordAnim(s.h2,t,1.0,.14,{y:80});
 const p=$('#plot');p.style.strokeDasharray=1;p.style.strokeDashoffset=1-E.io(seg(t,.0,.9));
 $('#plot2').style.opacity=seg(t,.9,1.2)*(.4+.4*Math.sin(t*10));$('#plot2').style.transform=`scale(${1+.03*Math.sin(t*6)})`;
 $('#dim1').style.strokeDasharray=1;$('#dim1').style.strokeDashoffset=1-E.out(seg(t,.4,1.1));
 s.q.forEach(o=>pop(o.c,t,o.t0,{y:-120,s:.4,r:o.r*2,d:.28,post:`rotate(${o.r}deg)`}));
 s.d.style.filter=t>3.85?`brightness(${1+ (t-3.85)*6})`:'none'};

/* ---- S1 logo drop 4-6 ---- */
{const s=sc('s1','light',4,6);s.d.appendChild(el('grid'));
 s.d.insertAdjacentHTML('beforeend',svg(1080,1920,`<g style="color:var(--hair)"><path class="ln" pathLength="1" id="fr" d="M60 60 H1020 V1860 H60 Z" style="stroke-width:2"/></g>`));
 s.logo=el('abs','<img src="img/logo.png" style="width:1100px;height:auto;display:block">',"left:-10px;top:540px;width:1100px");
 s.tag=el('abs','',"left:0;right:0;top:1120px;text-align:center");
 s.tag.innerHTML='<div class="h" style="font-size:88px;color:var(--slate)">אדריכלית.</div><div class="h clay" style="font-size:88px">בתים פרטיים.</div>';
 s.n1=el('abs','<div class="h" style="font-size:190px;color:var(--slate)"><span dir="ltr"><span id="c1">0</span>+</span></div><div class="label" style="justify-content:center;margin-top:8px;color:var(--slate)"><span>שנות ניסיון</span></div>',"right:70px;width:440px;top:1440px;text-align:center");
 s.n2=el('abs','<div class="h" style="font-size:190px;color:var(--clay)"><span dir="ltr"><span id="c2">0</span>+</span></div><div class="label" style="justify-content:center;margin-top:8px;color:var(--slate)"><span>בתים שתוכננו</span></div>',"left:70px;width:440px;top:1440px;text-align:center");
 s.d.append(s.logo,s.tag,s.n1,s.n2);s.d.appendChild(el('abs','',"left:540px;top:1420px;width:2px;height:330px;background:var(--hair)"))}
S.s1.update=t=>{const s=S.s1;pop(s.logo,t,4.0,{s:1.35,d:.5,ease:E.expo});
 $('#fr').style.strokeDasharray=1;$('#fr').style.strokeDashoffset=1-E.out(seg(t,4,4.8));
 [...s.tag.children].forEach((c,i)=>pop(c,t,4.5+i*.25,{y:50,d:.3}));
 pop(s.n1,t,5.0,{y:80,d:.3});pop(s.n2,t,5.5,{y:80,d:.3});
 $('#c1').textContent=Math.round(25*E.out(seg(t,5.0,5.4)));$('#c2').textContent=Math.round(100*E.out(seg(t,5.5,5.9)))};

/* ---- S2 chat 6-8 ---- */
{const s=sc('s2','light',6,8);s.d.appendChild(el('grid'));
 s.d.appendChild(labelEl('01','שיחה אחת',"position:absolute;right:70px;top:150px"));
 s.hd=words('שיחה אחת.','',"position:absolute;right:70px;left:70px;top:230px;font-size:170px;color:var(--slate)");
 s.hd2=words('בלי עלות.','',"position:absolute;right:70px;left:70px;top:410px;font-size:170px;color:var(--clay)");
 s.phone=el('abs','',"left:130px;top:700px;width:820px;height:1400px;background:var(--ink);border-radius:80px;padding:26px;box-shadow:0 60px 120px rgba(37,50,60,.35)");
 s.scr=el('abs','',"left:26px;right:26px;top:26px;bottom:26px;background:#f1ede6;border-radius:56px;overflow:hidden");
 s.scr.appendChild(el('abs','<div style="display:flex;align-items:center;gap:22px;padding:0 34px;height:150px;color:#fff;font-weight:700;font-size:40px;background:var(--slate)"><div style="width:76px;height:76px;border-radius:50%;background:url(img/tal.jpg) center/cover"></div><div>טל גורן · אדריכלית<div style="font-weight:400;font-size:26px;opacity:.7">מחוברת</div></div></div>',"left:0;right:0;top:0"));
 s.b1=el('bubble','היי, אני טל.<br>ספרו לי על המגרש.',"right:40px;top:200px;background:#fff;border-radius:34px 34px 34px 6px;color:var(--slate)");
 s.b2=el('bubble','פגישת ייעוץ ראשונה —<br><b style="color:var(--clay)">עליי.</b>',"right:40px;top:410px;background:#fff;border-radius:34px 34px 34px 6px;color:var(--slate)");
 s.b3=el('bubble','<span id="typed"></span>',"left:40px;top:640px;background:#dbe6dc;border-radius:34px 34px 6px 34px;color:var(--ink);min-width:260px");
 s.dots=el('bubble','<span style="letter-spacing:.3em;font-size:56px;line-height:.5">•••</span>',"right:40px;top:620px;background:#fff;border-radius:34px 34px 34px 6px;padding:34px 40px");
 s.scr.append(s.b1,s.b2,s.dots,s.b3);s.phone.appendChild(s.scr);s.d.append(s.hd,s.hd2,s.phone);
 s.notif=el('abs','<b>טל גורן</b><br>פגישת ייעוץ ראשונה ללא עלות',"right:120px;left:120px;top:590px;padding:24px 34px;background:rgba(37,50,60,.94);color:#fff;font-size:34px;border-radius:30px;z-index:5")}
S.s2.update=t=>{const s=S.s2;wordAnim(s.hd,t,6.05,.12);wordAnim(s.hd2,t,6.3,.12);
 pop(s.phone,t,6.0,{y:600,r:5,d:.5,ease:E.expo,post:`rotate(${-2+Math.sin(t*3)*.6}deg)`});
 pop(s.b1,t,6.15,{s:.6,y:40,d:.25});pop(s.b2,t,6.65,{s:.6,y:40,d:.25});
 s.dots.style.opacity=(t>7.0&&t<7.5)?0:0;
 const full='מעולה, מתי נפגשים?';const k=Math.floor(full.length*seg(t,7.0,7.5));$('#typed').textContent=full.slice(0,k);
 s.b3.style.opacity=t>=7.0?1:0;s.b3.style.transform=`scale(${1+(t>7.5?Math.max(0,.06-(t-7.5)*.3):0)})`;
 };

/* ---- S3 בירורים 8-10 ---- */
{const s=sc('s3','dark',8,10);s.d.appendChild(el('grid'));
 s.d.appendChild(labelEl('01','בירורים מקדימים',"position:absolute;right:70px;top:150px"));
 s.hd=words('קודם בודקים.','',"position:absolute;right:70px;left:70px;top:230px;font-size:160px;color:#fff");
 s.hd2=words('אחר כך משרטטים.','',"position:absolute;right:70px;left:70px;top:410px;font-size:110px;color:#d4a08a");
 s.d.append(s.hd,s.hd2);
 s.d.insertAdjacentHTML('beforeend',svg(1080,1920,`
  <g style="color:#fff"><path id="p3" class="ln" pathLength="1" d="M160 900 L900 850 L980 1250 L620 1450 L200 1380 Z" style="stroke-width:5"/></g>
  <g style="color:#d4a08a"><path id="p3b" class="ln" pathLength="1" d="M270 990 L810 955 L865 1210 L610 1330 L300 1285 Z" style="stroke-dasharray:18 12"/></g>
  <g style="color:#fff"><path id="d3" class="ln" pathLength="1" d="M160 800 L900 750 M160 780 v40 M900 730 v40" style="stroke-width:2"/><path id="d3b" class="ln" pathLength="1" d="M1040 850 L1040 1250 M1020 850 h40 M1020 1250 h40" style="stroke-width:2"/></g>
  <rect id="scan" x="120" y="0" width="840" height="6" fill="#d4a08a"/>`));
 const T=[['זכויות בנייה',8.0,700,1560],['מגבלות תכנון',8.5,130,1660],['קווי בניין',9.0,640,1760]];
 s.t=T.map(a=>{const c=el('chip',a[0],`right:${a[2]>600?90:300}px;top:${a[3]}px;font-size:56px;color:var(--slate);border-color:#fff;box-shadow:12px 12px 0 #d4a08a`);s.d.appendChild(c);return {c,t0:a[1]}});
 s.d.appendChild(el('abs','<span>בדיקת המגרש</span>',"left:0;right:0;top:1030px;text-align:center;font-size:38px;font-weight:600;letter-spacing:.3em;color:rgba(255,255,255,.7)"))}
S.s3.update=t=>{const s=S.s3;wordAnim(s.hd,t,8.05,.13);wordAnim(s.hd2,t,8.3,.12);
 [['p3',8.0,8.7],['p3b',8.4,9.1],['d3',8.3,8.9],['d3b',8.5,9.1]].forEach(a=>{const e=$('#'+a[0]);if(a[0]!=='p3b'){e.style.strokeDasharray=1;e.style.strokeDashoffset=1-E.io(seg(t,a[1],a[2]))}else e.style.opacity=seg(t,a[1],a[1]+.3)});
 const u=(t-8.5)%1.5/1.5;$('#scan').setAttribute('y',780+ (Math.abs(((t-8)/.75)%2-1))*760);$('#scan').style.opacity=t>8.3?.9:0;
 s.t.forEach(o=>pop(o.c,t,o.t0,{x:200,d:.3}))};

/* ---- S4 תכנון 10-12 ---- */
{const s=sc('s4','light',10,12);s.d.appendChild(el('grid'));
 s.d.appendChild(labelEl('02','תכנון מוקדם',"position:absolute;right:70px;top:150px"));
 s.hd=words('מהצרכים שלכם','',"position:absolute;right:70px;left:70px;top:230px;font-size:120px;color:var(--slate)");
 s.hd2=words('לבית על הנייר.','',"position:absolute;right:70px;left:70px;top:370px;font-size:120px;color:var(--clay)");
 s.d.append(s.hd,s.hd2);
 const rooms=[['M140 760 H620 V1180 H140 Z','סלון',10.1],['M620 760 H940 V1030 H620 Z','מטבח',10.3],['M620 1030 H940 V1400 H620 Z','שינה',10.5],['M140 1180 H620 V1400 H140 Z','ילדים',10.7],['M140 1400 H940 V1620 H140 Z','גינה',10.9]];
 s.rooms=rooms;
 s.d.insertAdjacentHTML('beforeend',svg(1080,1920,`<g style="color:var(--slate)">${rooms.map((r,i)=>`<path id="rm${i}" class="ln" pathLength="1" d="${r[0]}" style="stroke-width:${i==4?2:8}"/><rect id="rf${i}" x="0" y="0" width="0" height="0" fill="var(--clay)" opacity="0"/>`).join('')}</g><g style="color:var(--clay)"><path id="dr" class="ln" pathLength="1" d="M420 1180 h100 M620 900 v-90 M700 1030 h90" style="stroke-width:8"/></g>`));
 s.lbl=rooms.map((r,i)=>{const nums=r[0].match(/\d+/g).map(Number);const x=(nums[0]+nums[2]||0);const c=el('abs',r[1],`font-weight:800;font-size:44px;color:var(--slate);left:${(140)}px;top:0;opacity:0`);s.d.appendChild(c);return c});
 const pos=[[380,940],[780,890],[780,1200],[380,1270],[540,1490]];s.pos=pos;
 s.stat=el('abs','<div class="h" style="font-size:140px;color:var(--slate)"><span id="sqm">0</span> <span style="font-size:60px" class="clay">מ״ר</span></div>',"left:0;right:0;top:1700px;text-align:center");s.d.appendChild(s.stat)}
S.s4.update=t=>{const s=S.s4;wordAnim(s.hd,t,10.05,.1);wordAnim(s.hd2,t,10.3,.1);
 s.rooms.forEach((r,i)=>{const e=$('#rm'+i);e.style.strokeDasharray=1;e.style.strokeDashoffset=1-E.out(seg(t,r[2]-.12,r[2]+.2));
  const l=s.lbl[i];l.style.transform='translate(-50%,-50%)';l.style.left=s.pos[i][0]+'px';l.style.top=s.pos[i][1]+'px';pop(l,t,r[2]+.1,{s:.5,d:.25,post:' translate(-50%,-50%)'});});
 pop(s.stat,t,11.1,{y:60,d:.3});$('#sqm').textContent=Math.round(187*E.out(seg(t,11.1,11.9)));
 const d=$('#dr');d.style.strokeDasharray=1;d.style.strokeDashoffset=1-seg(t,11.0,11.4)};

/* ---- S5 רישוי / permit stamp 12-14 ---- */
{const s=sc('s5','dark',12,14);s.d.appendChild(el('grid'));

  // wipes on scene cuts

  let f=0;[4,26,29].forEach(c=>{const d=t-c;if(d>=0&&d<.35)f=Math.max(f,(c===29?.4:.95)*Math.pow(1-d/.35,2))});

  hud.querySelectorAll('.corner').forEach(c=>c.style.borderColor=(S.s1.d.style.display==='block'||t>=6&&t<8||S.s4.d.style.display==='block'||S.s6.d.style.display==='block'||S.s10.d.style.display==='block'||S.s11.d.style.display==='block')?'rgba(46,66,80,.5)':'rgba(255,255,255,.75)');
};
